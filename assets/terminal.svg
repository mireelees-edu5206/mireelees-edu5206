<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="terminalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Terminal window -->
  <rect width="400" height="250" fill="#0d1117" rx="8" stroke="#30363d" stroke-width="1"/>
  
  <!-- Terminal header -->
  <rect width="400" height="30" fill="#161b22" rx="8"/>
  <rect y="30" width="400" height="20" fill="#161b22"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="15" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="15" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="15" r="6" fill="#27ca40"/>
  
  <!-- Terminal content -->
  <text x="15" y="60" font-family="monospace" font-size="12" fill="#8b949e">
    <tspan fill="#00d4ff">brayan@github</tspan>:~$ whoami
  </text>
  
  <text x="15" y="80" font-family="monospace" font-size="12" fill="#c9d1d9">
    Software Developer
  </text>
  
  <text x="15" y="105" font-family="monospace" font-size="12" fill="#8b949e">
    <tspan fill="#00d4ff">brayan@github</tspan>:~$ skills
  </text>
  
  <text x="15" y="125" font-family="monospace" font-size="12" fill="url(#terminalGradient)">
    React • Python • TypeScript
  </text>
  <text x="15" y="145" font-family="monospace" font-size="12" fill="url(#terminalGradient)">
    FastAPI • Node • PostgreSQL
  </text>
  
  <text x="15" y="170" font-family="monospace" font-size="12" fill="#8b949e">
    <tspan fill="#00d4ff">brayan@github</tspan>:~$ status
  </text>
  
  <text x="15" y="190" font-family="monospace" font-size="12" fill="#27ca40">
    ● Building projects
  </text>
  <text x="15" y="210" font-family="monospace" font-size="12" fill="#27ca40">
    ● Learning
  </text>
  
  <!-- Animated cursor -->
  <rect x="15" y="225" width="8" height="14" fill="#00d4ff">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
