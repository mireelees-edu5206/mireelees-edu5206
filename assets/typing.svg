<svg xmlns="http://www.w3.org/2000/svg" width="600" height="80" viewBox="0 0 600 80">
  <defs>
    <linearGradient id="typingGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="80" fill="#0d1117" rx="8"/>
  
  <!-- Typing text with cursor animation -->
  <text x="20" y="48" font-family="monospace" font-size="20" fill="url(#typingGradient)">
    <tspan>Software Developer</tspan>
    <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/>
  </text>
  
  <text x="20" y="48" font-family="monospace" font-size="20" fill="url(#typingGradient)" opacity="0">
    <tspan>Full Stack Developer</tspan>
    <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1s" repeatCount="indefinite"/>
  </text>
  
  <text x="20" y="48" font-family="monospace" font-size="20" fill="url(#typingGradient)" opacity="0">
    <tspan>Multiplatform Developer</tspan>
    <animate attributeName="opacity" values="0;1;0" dur="3s" begin="2s" repeatCount="indefinite"/>
  </text>
  
  <!-- Cursor -->
  <rect x="280" y="28" width="2" height="24" fill="#00d4ff">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
