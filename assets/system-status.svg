<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="neonGreenStatus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff66;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonCyanStatus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlowStatus">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="#000000" rx="8" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Title -->
  <text x="20" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#e0e0e0">
    SYSTEM STATUS
  </text>
  
  <!-- Status indicator -->
  <circle cx="350" cy="25" r="6" fill="#00ff66" filter="url(#neonGlowStatus)">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="320" y="29" font-family="monospace" font-size="10" fill="#00ff66" filter="url(#neonGlowStatus)">
    ONLINE
  </text>
  
  <!-- Divider -->
  <line x1="20" y1="45" x2="380" y2="45" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Currently Building -->
  <text x="20" y="70" font-family="monospace" font-size="11" fill="url(#neonCyanStatus)" filter="url(#neonGlowStatus)">
    CURRENTLY BUILDING
  </text>
  
  <g font-family="monospace" font-size="10" fill="#a0a0a0">
    <text x="30" y="90">Web Applications</text>
    <text x="30" y="105">Multiplatform Software</text>
    <text x="30" y="120">AI-powered Solutions</text>
    <text x="30" y="135">APIs & Systems</text>
  </g>
  
  <!-- Divider -->
  <line x1="20" y1="150" x2="380" y2="150" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Currently Learning -->
  <text x="20" y="170" font-family="monospace" font-size="11" fill="url(#neonCyanStatus)" filter="url(#neonGlowStatus)">
    CURRENTLY LEARNING
  </text>
  
  <g font-family="monospace" font-size="10" fill="#a0a0a0">
    <text x="30" y="190">Full Stack • Architecture • AI</text>
  </g>
  
  <!-- Decorative corner -->
  <path d="M 380 180 L 380 190 L 370 190" stroke="#00ff66" stroke-width="1" fill="none" filter="url(#neonGlowStatus)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>
