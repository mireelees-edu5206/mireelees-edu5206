<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250">
  <defs>
    <linearGradient id="neonCyanTime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonPurpleTime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9900ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlowTime">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="250" fill="#000000" rx="8" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Title -->
  <text x="20" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#e0e0e0">
    PROJECT EXPERIENCE
  </text>
  
  <!-- Timeline line -->
  <line x1="80" y1="50" x2="80" y2="220" stroke="url(#neonCyanTime)" stroke-width="2" filter="url(#neonGlowTime)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </line>
  
  <!-- Project 1: ComuniAlert -->
  <circle cx="80" cy="70" r="6" fill="#ff0066" filter="url(#neonGlowTime)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="65" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff0066" filter="url(#neonGlowTime)">
    COMUNIALERT
  </text>
  <text x="100" y="80" font-family="monospace" font-size="10" fill="#a0a0a0">
    Technical Lead • Python • Kivy
  </text>
  
  <!-- Project 2: EcoResiduos -->
  <circle cx="80" cy="120" r="6" fill="#00ff66" filter="url(#neonGlowTime)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#00ff66" filter="url(#neonGlowTime)">
    ECORESIDUOS
  </text>
  <text x="100" y="130" font-family="monospace" font-size="10" fill="#a0a0a0">
    Technical Lead • React • Node.js • GraphQL
  </text>
  
  <!-- Project 3: ÍXA -->
  <circle cx="80" cy="170" r="6" fill="#00ffff" filter="url(#neonGlowTime)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#00ffff" filter="url(#neonGlowTime)">
    ÍXA
  </text>
  <text x="100" y="180" font-family="monospace" font-size="10" fill="#a0a0a0">
    Software Development • Python • FastAPI • React
  </text>
  
  <!-- Software Development section -->
  <circle cx="80" cy="210" r="5" fill="url(#neonPurpleTime)" filter="url(#neonGlowTime)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="205" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="url(#neonPurpleTime)" filter="url(#neonGlowTime)">
    SOFTWARE DEVELOPMENT
  </text>
  <text x="100" y="220" font-family="monospace" font-size="10" fill="#a0a0a0">
    All Projects • Full Stack Development
  </text>
  
  <!-- Animated border -->
  <rect x="5" y="5" width="590" height="240" fill="none" stroke="url(#neonCyanTime)" stroke-width="1" rx="6" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
