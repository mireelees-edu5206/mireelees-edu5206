<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150">
  <defs>
    <linearGradient id="neonCyanLang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonPurpleLang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9900ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlowLang">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="150" fill="#000000" rx="8" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Title -->
  <text x="20" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#e0e0e0">
    LANGUAGES
  </text>
  
  <!-- Divider -->
  <line x1="20" y1="45" x2="380" y2="45" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Spanish -->
  <rect x="20" y="60" width="170" height="70" fill="#111111" rx="4" stroke="#00ffff" stroke-width="1" filter="url(#neonGlowLang)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="105" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00ffff" filter="url(#neonGlowLang)">
    SPANISH
  </text>
  <text x="105" y="105" text-anchor="middle" font-family="monospace" font-size="10" fill="#a0a0a0">
    NATIVE
  </text>
  
  <!-- English -->
  <rect x="210" y="60" width="170" height="70" fill="#111111" rx="4" stroke="#ff00ff" stroke-width="1" filter="url(#neonGlowLang)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <text x="295" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff00ff" filter="url(#neonGlowLang)">
    ENGLISH
  </text>
  <text x="295" y="105" text-anchor="middle" font-family="monospace" font-size="10" fill="#a0a0a0">
    BASIC
  </text>
  
  <!-- Animated border -->
  <rect x="5" y="5" width="390" height="140" fill="none" stroke="url(#neonCyanLang)" stroke-width="1" rx="6" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
