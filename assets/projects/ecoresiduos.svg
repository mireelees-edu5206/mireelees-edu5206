<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="neonGreenEco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff66;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonCyanEco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlowEco">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="#000000" rx="12" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Data particles animation -->
  <g fill="url(#neonGreenEco)" filter="url(#neonGlowEco)">
    <circle cx="50" cy="50" r="3">
      <animate attributeName="cy" values="50;30;50" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="80" r="2">
      <animate attributeName="cy" values="80;60;80" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="60" r="2.5">
      <animate attributeName="cy" values="60;40;60" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="90" r="2">
      <animate attributeName="cy" values="90;70;90" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="70" r="3">
      <animate attributeName="cy" values="70;50;70" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="85" r="2.5">
      <animate attributeName="cy" values="85;65;85" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Data nodes -->
  <g stroke="url(#neonCyanEco)" stroke-width="1" fill="none" filter="url(#neonGlowEco)" opacity="0.4">
    <line x1="50" y1="50" x2="150" y2="80">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="80" x2="250" y2="60">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="250" y1="60" x2="350" y2="90">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="350" y1="90" x2="450" y2="70">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.8s" repeatCount="indefinite"/>
    </line>
    <line x1="450" y1="70" x2="550" y2="85">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.2s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Project name -->
  <text x="20" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#neonGreenEco)" filter="url(#neonGlowEco)">
    EcoResiduos
  </text>
  <text x="20" y="155" font-family="Arial, sans-serif" font-size="12" fill="#e0e0e0">
    Sistema de Gestión de Residuos
  </text>
  
  <!-- Description -->
  <text x="20" y="180" font-family="Arial, sans-serif" font-size="11" fill="#a0a0a0">
    Sistema digital para registrar, clasificar y analizar residuos
  </text>
  <text x="20" y="195" font-family="Arial, sans-serif" font-size="11" fill="#a0a0a0">
    en pequeños negocios y comunidades.
  </text>
  
  <!-- Technologies -->
  <text x="20" y="220" font-family="monospace" font-size="10" font-weight="bold" fill="url(#neonCyanEco)" filter="url(#neonGlowEco)">
    TECHNOLOGIES
  </text>
  <g font-family="monospace" font-size="9" fill="#a0a0a0">
    <text x="20" y="238">React</text>
    <text x="70" y="238">TypeScript</text>
    <text x="150" y="238">React Native</text>
    <text x="250" y="238">Node.js</text>
    <text x="320" y="238">GraphQL</text>
    <text x="20" y="252">Apollo</text>
    <text x="70" y="252">PostgreSQL</text>
    <text x="160" y="252">Docker</text>
  </g>
  
  <!-- Leadership badge -->
  <rect x="450" y="225" width="130" height="25" fill="#111111" rx="4" stroke="#00ff66" stroke-width="1"/>
  <text x="515" y="242" text-anchor="middle" font-family="monospace" font-size="9" fill="#00ff66" filter="url(#neonGlowEco)">
    TECHNICAL LEAD
  </text>
  
  <!-- Animated border -->
  <rect x="10" y="10" width="580" height="280" fill="none" stroke="url(#neonGreenEco)" stroke-width="1" rx="10" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
