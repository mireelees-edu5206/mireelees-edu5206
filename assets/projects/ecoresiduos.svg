<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="ecoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ca40;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="#0d1117" rx="12" stroke="#30363d" stroke-width="1"/>
  
  <!-- Project icon -->
  <circle cx="50" cy="50" r="30" fill="url(#ecoGradient)" opacity="0.2"/>
  <text x="50" y="55" text-anchor="middle" font-size="24">🌱</text>
  
  <!-- Project name -->
  <text x="100" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#c9d1d9">
    EcoResiduos
  </text>
  <text x="100" y="70" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">
    Sistema de Gestión de Residuos
  </text>
  
  <!-- Description -->
  <text x="20" y="110" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">
    Sistema digital para registrar, clasificar y analizar residuos
  </text>
  <text x="20" y="130" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">
    en pequeños negocios y comunidades.
  </text>
  
  <!-- Technologies -->
  <text x="20" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c9d1d9">
    TECNOLOGÍAS
  </text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#8b949e">
    <text x="20" y="185">⚛️ React</text>
    <text x="80" y="185">📘 TypeScript</text>
    <text x="180" y="185">📱 React Native</text>
    <text x="290" y="185">🟢 Node.js</text>
    <text x="370" y="185">🔗 GraphQL</text>
    <text x="20" y="205">🚀 Apollo</text>
    <text x="90" y="205">🐘 PostgreSQL</text>
    <text x="200" y="205">🐙 Docker</text>
  </g>
  
  <!-- Features -->
  <text x="20" y="240" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c9d1d9">
    CARACTERÍSTICAS
  </text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#8b949e">
    <text x="20" y="260">✓ Registro de residuos</text>
    <text x="20" y="275">✓ Dashboard con estadísticas</text>
    <text x="250" y="260">✓ Clasificación inteligente</text>
    <text x="250" y="275">✓ Análisis de datos ambientales</text>
  </g>
  
  <!-- Leadership badge -->
  <rect x="450" y="240" width="130" height="40" fill="#161b22" rx="4" stroke="#27ca40" stroke-width="1"/>
  <text x="515" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ca40">
    👨‍💻 Liderazgo Técnico
  </text>
</svg>
