<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="comuniGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff5f56;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffbd2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="#0d1117" rx="12" stroke="#30363d" stroke-width="1"/>
  
  <!-- Project icon -->
  <circle cx="50" cy="50" r="30" fill="url(#comuniGradient)" opacity="0.2"/>
  <text x="50" y="55" text-anchor="middle" font-size="24">🚨</text>
  
  <!-- Project name -->
  <text x="100" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#c9d1d9">
    ComuniAlert
  </text>
  <text x="100" y="70" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">
    Sistema de Reporte de Seguridad Comunitaria
  </text>
  
  <!-- Description -->
  <text x="20" y="110" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">
    Aplicación para facilitar el reporte de situaciones de inseguridad
  </text>
  <text x="20" y="130" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">
    dentro de una comunidad mediante tecnología móvil.
  </text>
  
  <!-- Technologies -->
  <text x="20" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c9d1d9">
    TECNOLOGÍAS
  </text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#8b949e">
    <text x="20" y="185">🐍 Python</text>
    <text x="90" y="185">🐘 Kivy</text>
    <text x="160" y="185">🗄️ Base de datos</text>
  </g>
  
  <!-- Features -->
  <text x="20" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c9d1d9">
    CARACTERÍSTICAS
  </text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#8b949e">
    <text x="20" y="240">✓ Reporte de incidentes</text>
    <text x="20" y="255">✓ Geolocalización</text>
    <text x="20" y="270">✓ Notificaciones en tiempo real</text>
    <text x="250" y="240">✓ Interfaz móvil intuitiva</text>
    <text x="250" y="255">✓ Base de datos local</text>
    <text x="250" y="270">✓ Comunicación comunitaria</text>
  </g>
  
  <!-- Leadership badge -->
  <rect x="450" y="240" width="130" height="40" fill="#161b22" rx="4" stroke="#ff5f56" stroke-width="1"/>
  <text x="515" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ff5f56">
    👨‍💻 Liderazgo Técnico
  </text>
</svg>
