<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="neonRedCom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0066;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0099;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonOrangeCom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9900;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlowCom">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="#000000" rx="12" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Connection network animation -->
  <g stroke="url(#neonRedCom)" stroke-width="1" fill="none" filter="url(#neonGlowCom)" opacity="0.5">
    <circle cx="50" cy="50" r="5" fill="#ff0066"/>
    <circle cx="150" cy="80" r="4" fill="#ff0066"/>
    <circle cx="250" cy="60" r="4" fill="#ff0066"/>
    <circle cx="350" cy="90" r="5" fill="#ff0066"/>
    <circle cx="450" cy="70" r="4" fill="#ff0066"/>
    <circle cx="550" cy="85" r="4" fill="#ff0066"/>
    
    <line x1="50" y1="50" x2="150" y2="80">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="80" x2="250" y2="60">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="250" y1="60" x2="350" y2="90">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="350" y1="90" x2="450" y2="70">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <line x1="450" y1="70" x2="550" y2="85">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.8s" repeatCount="indefinite"/>
    </line>
    <line x1="50" y1="50" x2="350" y2="90">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="80" x2="450" y2="70">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3.2s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Project name -->
  <text x="20" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#neonRedCom)" filter="url(#neonGlowCom)">
    ComuniAlert
  </text>
  <text x="20" y="155" font-family="Arial, sans-serif" font-size="12" fill="#e0e0e0">
    Sistema de Reporte de Seguridad Comunitaria
  </text>
  
  <!-- Description -->
  <text x="20" y="180" font-family="Arial, sans-serif" font-size="11" fill="#a0a0a0">
    Aplicación para facilitar el reporte de situaciones de inseguridad
  </text>
  <text x="20" y="195" font-family="Arial, sans-serif" font-size="11" fill="#a0a0a0">
    dentro de una comunidad mediante tecnología móvil.
  </text>
  
  <!-- Technologies -->
  <text x="20" y="220" font-family="monospace" font-size="10" font-weight="bold" fill="url(#neonOrangeCom)" filter="url(#neonGlowCom)">
    TECHNOLOGIES
  </text>
  <g font-family="monospace" font-size="9" fill="#a0a0a0">
    <text x="20" y="238">Python</text>
    <text x="80" y="238">Kivy</text>
    <text x="140" y="238">Database</text>
  </g>
  
  <!-- Leadership badge -->
  <rect x="450" y="225" width="130" height="25" fill="#111111" rx="4" stroke="#ff0066" stroke-width="1"/>
  <text x="515" y="242" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff0066" filter="url(#neonGlowCom)">
    TECHNICAL LEAD
  </text>
  
  <!-- Animated border -->
  <rect x="10" y="10" width="580" height="280" fill="none" stroke="url(#neonRedCom)" stroke-width="1" rx="10" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
