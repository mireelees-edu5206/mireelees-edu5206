<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="ixaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="#0d1117" rx="12" stroke="#30363d" stroke-width="1"/>
  
  <!-- Project icon -->
  <circle cx="50" cy="50" r="30" fill="url(#ixaGradient)" opacity="0.2"/>
  <text x="50" y="55" text-anchor="middle" font-size="24">🏝️</text>
  
  <!-- Project name -->
  <text x="100" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#c9d1d9">
    ÍXA
  </text>
  <text x="100" y="70" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">
    Plataforma de Recomendación Turística Inteligente
  </text>
  
  <!-- Description -->
  <text x="20" y="110" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">
    Plataforma de recomendación turística para Isla Mujeres con
  </text>
  <text x="20" y="130" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">
    itinerarios personalizados y enfoque en turismo sustentable.
  </text>
  
  <!-- Technologies -->
  <text x="20" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c9d1d9">
    TECNOLOGÍAS
  </text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#8b949e">
    <text x="20" y="185">🐍 Python</text>
    <text x="100" y="185">⚡ FastAPI</text>
    <text x="180" y="185">⚛️ React</text>
    <text x="250" y="185">🐬 MySQL</text>
    <text x="330" y="185">🤖 Algoritmos</text>
    <text x="430" y="185">📱 PWA</text>
  </g>
  
  <!-- Features -->
  <text x="20" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c9d1d9">
    CARACTERÍSTICAS
  </text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#8b949e">
    <text x="20" y="240">✓ Recomendaciones personalizadas</text>
    <text x="20" y="255">✓ Mapa turístico interactivo</text>
    <text x="20" y="270">✓ Clasificación de perfiles</text>
    <text x="250" y="240">✓ Itinerarios inteligentes</text>
    <text x="250" y="255">✓ Turismo sustentable</text>
    <text x="250" y="270">✓ PWA offline</text>
  </g>
  
  <!-- Methodology badge -->
  <rect x="480" y="250" width="100" height="30" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="530" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#00d4ff">
    Scrum
  </text>
</svg>
