<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="neonCyanIxa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonPurpleIxa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9900ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlowIxa">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="#000000" rx="12" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Map route animation -->
  <g stroke="url(#neonCyanIxa)" stroke-width="1.5" fill="none" filter="url(#neonGlowIxa)" opacity="0.6">
    <circle cx="50" cy="50" r="4" fill="#00ffff"/>
    <circle cx="150" cy="80" r="4" fill="#00ffff"/>
    <circle cx="250" cy="60" r="4" fill="#00ffff"/>
    <circle cx="350" cy="90" r="4" fill="#00ffff"/>
    <circle cx="450" cy="70" r="4" fill="#00ffff"/>
    <circle cx="550" cy="85" r="4" fill="#00ffff"/>
    
    <path d="M 50 50 L 150 80 L 250 60 L 350 90 L 450 70 L 550 85">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Project name -->
  <text x="20" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#neonCyanIxa)" filter="url(#neonGlowIxa)">
    ÍXA
  </text>
  <text x="20" y="155" font-family="Arial, sans-serif" font-size="12" fill="#e0e0e0">
    Plataforma de Recomendación Turística Inteligente
  </text>
  
  <!-- Description -->
  <text x="20" y="180" font-family="Arial, sans-serif" font-size="11" fill="#a0a0a0">
    Plataforma de recomendación turística para Isla Mujeres con
  </text>
  <text x="20" y="195" font-family="Arial, sans-serif" font-size="11" fill="#a0a0a0">
    itinerarios personalizados y enfoque en turismo sustentable.
  </text>
  
  <!-- Technologies -->
  <text x="20" y="220" font-family="monospace" font-size="10" font-weight="bold" fill="url(#neonPurpleIxa)" filter="url(#neonGlowIxa)">
    TECHNOLOGIES
  </text>
  <g font-family="monospace" font-size="9" fill="#a0a0a0">
    <text x="20" y="238">Python</text>
    <text x="80" y="238">FastAPI</text>
    <text x="150" y="238">React</text>
    <text x="210" y="238">MySQL</text>
    <text x="270" y="238">Algorithms</text>
    <text x="350" y="238">PWA</text>
  </g>
  
  <!-- Methodology badge -->
  <rect x="480" y="225" width="100" height="25" fill="#111111" rx="4" stroke="#1a1a1a" stroke-width="1"/>
  <text x="530" y="242" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ffff" filter="url(#neonGlowIxa)">
    Scrum
  </text>
  
  <!-- Animated border -->
  <rect x="10" y="10" width="580" height="280" fill="none" stroke="url(#neonCyanIxa)" stroke-width="1" rx="10" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
