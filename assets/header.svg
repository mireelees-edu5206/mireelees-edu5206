<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9900ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff66;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="intenseGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="#000000" rx="12"/>
  
  <!-- Neon grid lines -->
  <g stroke="url(#neonCyan)" stroke-width="1" opacity="0.4" filter="url(#neonGlow)">
    <line x1="0" y1="40" x2="800" y2="40">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="80" x2="800" y2="80">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="120" x2="800" y2="120">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="160" x2="800" y2="160">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.2s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Vertical grid lines -->
  <g stroke="url(#neonPurple)" stroke-width="1" opacity="0.3" filter="url(#neonGlow)">
    <line x1="100" y1="0" x2="100" y2="200">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="0" x2="300" y2="200">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="500" y1="0" x2="500" y2="200">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="700" y1="0" x2="700" y2="200">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2.8s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Animated particles -->
  <g filter="url(#intenseGlow)">
    <circle cx="80" cy="60" r="2" fill="#00ffff">
      <animate attributeName="cy" values="60;40;60" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="140" r="1.5" fill="#ff00ff">
      <animate attributeName="cy" values="140;120;140" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="50" r="2" fill="#00ff00">
      <animate attributeName="cy" values="50;30;50" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="150" r="1.5" fill="#00ffff">
      <animate attributeName="cy" values="150;130;150" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="70" r="2" fill="#ff00ff">
      <animate attributeName="cy" values="70;50;70" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="130" r="1.5" fill="#00ff00">
      <animate attributeName="cy" values="130;110;130" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Code-like elements -->
  <g fill="#00ffff" opacity="0.4" font-family="monospace" font-size="10">
    <text x="15" y="25">&lt;developer&gt;</text>
    <text x="730" y="185">&lt;/developer&gt;</text>
    <text x="15" y="185">const stack = ["React", "Python", "TypeScript"]</text>
  </g>
  
  <!-- Main title with intense neon glow -->
  <text x="400" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#neonCyan)" filter="url(#intenseGlow)">
    BRAYAN EDUARDO HERAS MIRELES
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
  </text>
  
  <!-- Subtitle with purple glow -->
  <text x="400" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="url(#neonPurple)" filter="url(#neonGlow)">
    SOFTWARE DEVELOPER
  </text>
  
  <text x="400" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#00ff66" filter="url(#neonGlow)">
    MULTIPLATFORM DEVELOPMENT
  </text>
  
  <!-- Neon corners -->
  <g stroke-width="2" fill="none" filter="url(#intenseGlow)">
    <path d="M 15 15 L 15 35 L 35 35" stroke="#00ffff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 785 15 L 785 35 L 765 35" stroke="#ff00ff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 15 185 L 15 165 L 35 165" stroke="#00ff00">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 785 185 L 785 165 L 765 165" stroke="#00ffff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Scanline effect -->
  <rect x="0" y="0" width="800" height="2" fill="#00ffff" opacity="0.1">
    <animate attributeName="y" values="0;200;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.05;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
