<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="neonCyanLearn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonPurpleLearn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9900ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlowLearn">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="200" fill="#000000" rx="8" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Title -->
  <text x="20" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#e0e0e0">
    CURRENTLY LEARNING
  </text>
  
  <!-- Learning Cards -->
  <rect x="20" y="50" width="130" height="50" fill="#111111" rx="4" stroke="#1a1a1a" stroke-width="1">
    <animate attributeName="stroke" values="#1a1a1a;#00ffff;#1a1a1a" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="85" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e0e0e0">
    FULL STACK
  </text>
  
  <rect x="170" y="50" width="130" height="50" fill="#111111" rx="4" stroke="#1a1a1a" stroke-width="1">
    <animate attributeName="stroke" values="#1a1a1a;#00ffff;#1a1a1a" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <text x="235" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e0e0e0">
    ARCHITECTURE
  </text>
  
  <rect x="320" y="50" width="130" height="50" fill="#111111" rx="4" stroke="#1a1a1a" stroke-width="1">
    <animate attributeName="stroke" values="#1a1a1a;#00ffff;#1a1a1a" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="385" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e0e0e0">
    AI / ML
  </text>
  
  <rect x="470" y="50" width="110" height="50" fill="#111111" rx="4" stroke="#1a1a1a" stroke-width="1">
    <animate attributeName="stroke" values="#1a1a1a;#00ffff;#1a1a1a" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <text x="525" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e0e0e0">
    APIs
  </text>
  
  <!-- Second row -->
  <rect x="20" y="120" width="170" height="50" fill="#111111" rx="4" stroke="#1a1a1a" stroke-width="1">
    <animate attributeName="stroke" values="#1a1a1a;#9900ff;#1a1a1a" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <text x="105" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e0e0e0">
    MULTIPLATFORM
  </text>
  
  <rect x="210" y="120" width="170" height="50" fill="#111111" rx="4" stroke="#1a1a1a" stroke-width="1">
    <animate attributeName="stroke" values="#1a1a1a;#9900ff;#1a1a1a" dur="3.8s" repeatCount="indefinite"/>
  </rect>
  <text x="295" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e0e0e0">
    DATABASES
  </text>
  
  <rect x="400" y="120" width="180" height="50" fill="#111111" rx="4" stroke="#1a1a1a" stroke-width="1">
    <animate attributeName="stroke" values="#1a1a1a;#9900ff;#1a1a1a" dur="4.2s" repeatCount="indefinite"/>
  </rect>
  <text x="490" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e0e0e0">
    SYSTEM DESIGN
  </text>
  
  <!-- Animated border -->
  <rect x="5" y="5" width="590" height="190" fill="none" stroke="url(#neonCyanLearn)" stroke-width="1" rx="6" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
