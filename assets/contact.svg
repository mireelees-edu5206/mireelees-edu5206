<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120">
  <defs>
    <linearGradient id="neonCyanContact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonPurpleContact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9900ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonGreenContact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff66;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlowContact">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="120" fill="#000000" rx="8" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Title -->
  <text x="20" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#e0e0e0">
    CONTACT
  </text>
  
  <!-- LinkedIn Button -->
  <rect x="20" y="50" width="170" height="50" fill="#111111" rx="4" stroke="#0066ff" stroke-width="1" filter="url(#neonGlowContact)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="105" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0066ff" filter="url(#neonGlowContact)">
    LINKEDIN
  </text>
  
  <!-- GitHub Button -->
  <rect x="210" y="50" width="170" height="50" fill="#111111" rx="4" stroke="#e0e0e0" stroke-width="1" filter="url(#neonGlowContact)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="295" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e0e0e0" filter="url(#neonGlowContact)">
    GITHUB
  </text>
  
  <!-- Email Button -->
  <rect x="400" y="50" width="180" height="50" fill="#111111" rx="4" stroke="#00ff66" stroke-width="1" filter="url(#neonGlowContact)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="490" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#00ff66" filter="url(#neonGlowContact)">
    EMAIL
  </text>
  
  <!-- Animated border -->
  <rect x="5" y="5" width="590" height="110" fill="none" stroke="url(#neonCyanContact)" stroke-width="1" rx="6" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
