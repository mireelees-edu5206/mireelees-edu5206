<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="javaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9900;stop-opacity:1" />
    </linearGradient>
    <filter id="javaGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="100" fill="#000000" rx="8" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Java logo representation -->
  <ellipse cx="50" cy="50" rx="15" ry="25" fill="none" stroke="url(#javaGradient)" stroke-width="2" filter="url(#javaGlow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="50" cy="50" rx="15" ry="25" fill="none" stroke="url(#javaGradient)" stroke-width="2" filter="url(#javaGlow)" transform="rotate(45 50 50)"/>
  
  <!-- Technology name -->
  <text x="90" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#javaGradient)" filter="url(#javaGlow)">
    JAVA
  </text>
  
  <!-- Category -->
  <text x="90" y="70" font-family="monospace" font-size="10" fill="#a0a0a0">
    LANGUAGE
  </text>
  
  <!-- Animated border -->
  <rect x="5" y="5" width="190" height="90" fill="none" stroke="url(#javaGradient)" stroke-width="1" rx="6" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
