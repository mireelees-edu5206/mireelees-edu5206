<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="cppGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
    <filter id="cppGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="100" fill="#000000" rx="8" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- C++ logo representation -->
  <text x="50" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#cppGradient)" filter="url(#cppGlow)">
    C++
  </text>
  
  <!-- Code lines animation -->
  <g stroke="url(#cppGradient)" stroke-width="1" opacity="0.4" filter="url(#cppGlow)">
    <line x1="90" y1="35" x2="180" y2="35">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="90" y1="50" x2="160" y2="50">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="90" y1="65" x2="170" y2="65">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Technology name -->
  <text x="90" y="85" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#cppGradient)" filter="url(#cppGlow)">
    C++
  </text>
  
  <!-- Category -->
  <text x="90" y="98" font-family="monospace" font-size="9" fill="#a0a0a0">
    LANGUAGE
  </text>
  
  <!-- Animated border -->
  <rect x="5" y="5" width="190" height="90" fill="none" stroke="url(#cppGradient)" stroke-width="1" rx="6" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
