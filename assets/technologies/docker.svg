<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="dockerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0099ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ccff;stop-opacity:1" />
    </linearGradient>
    <filter id="dockerGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="100" fill="#000000" rx="8" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Docker logo representation -->
  <rect x="35" y="35" width="12" height="12" fill="none" stroke="url(#dockerGradient)" stroke-width="2" filter="url(#dockerGlow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="49" y="35" width="12" height="12" fill="none" stroke="url(#dockerGradient)" stroke-width="2" filter="url(#dockerGlow)"/>
  <rect x="35" y="49" width="12" height="12" fill="none" stroke="url(#dockerGradient)" stroke-width="2" filter="url(#dockerGlow)"/>
  <rect x="49" y="49" width="12" height="12" fill="none" stroke="url(#dockerGradient)" stroke-width="2" filter="url(#dockerGlow)"/>
  
  <!-- Technology name -->
  <text x="90" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#dockerGradient)" filter="url(#dockerGlow)">
    DOCKER
  </text>
  
  <!-- Category -->
  <text x="90" y="70" font-family="monospace" font-size="10" fill="#a0a0a0">
    TOOLS / DEVOPS
  </text>
  
  <!-- Animated border -->
  <rect x="5" y="5" width="190" height="90" fill="none" stroke="url(#dockerGradient)" stroke-width="1" rx="6" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
