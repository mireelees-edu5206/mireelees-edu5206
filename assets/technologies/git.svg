<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="gitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9900;stop-opacity:1" />
    </linearGradient>
    <filter id="gitGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="100" fill="#000000" rx="8" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Git logo representation -->
  <circle cx="50" cy="50" r="20" fill="none" stroke="url(#gitGradient)" stroke-width="2" filter="url(#gitGlow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="35" r="5" fill="url(#gitGradient)" filter="url(#gitGlow)"/>
  <circle cx="65" cy="50" r="5" fill="url(#gitGradient)" filter="url(#gitGlow)"/>
  <circle cx="50" cy="65" r="5" fill="url(#gitGradient)" filter="url(#gitGlow)"/>
  <line x1="50" y1="35" x2="65" y2="50" stroke="url(#gitGradient)" stroke-width="2" filter="url(#gitGlow)"/>
  <line x1="50" y1="35" x2="50" y2="65" stroke="url(#gitGradient)" stroke-width="2" filter="url(#gitGlow)"/>
  
  <!-- Technology name -->
  <text x="90" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#gitGradient)" filter="url(#gitGlow)">
    GIT
  </text>
  
  <!-- Category -->
  <text x="90" y="70" font-family="monospace" font-size="10" fill="#a0a0a0">
    TOOLS / VERSION CONTROL
  </text>
  
  <!-- Animated border -->
  <rect x="5" y="5" width="190" height="90" fill="none" stroke="url(#gitGradient)" stroke-width="1" rx="6" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
