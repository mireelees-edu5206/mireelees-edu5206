<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="vscodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
    <filter id="vscodeGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="100" fill="#000000" rx="8" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- VS Code logo representation -->
  <polygon points="30,30 50,30 70,50 50,70 30,70 30,30" fill="none" stroke="url(#vscodeGradient)" stroke-width="2" filter="url(#vscodeGlow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="70,30 90,30 70,50 90,70 70,70 70,50" fill="none" stroke="url(#vscodeGradient)" stroke-width="2" filter="url(#vscodeGlow)"/>
  
  <!-- Technology name -->
  <text x="100" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#vscodeGradient)" filter="url(#vscodeGlow)">
    VS CODE
  </text>
  
  <!-- Category -->
  <text x="100" y="70" font-family="monospace" font-size="10" fill="#a0a0a0">
    TOOLS / IDE
  </text>
  
  <!-- Animated border -->
  <rect x="5" y="5" width="190" height="90" fill="none" stroke="url(#vscodeGradient)" stroke-width="1" rx="6" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
