<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="neonCyanAbout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonPurpleAbout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9900ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlowAbout">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="#000000" rx="8" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Title -->
  <text x="20" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#e0e0e0">
    ABOUT ME
  </text>
  
  <!-- Divider -->
  <line x1="20" y1="45" x2="380" y2="45" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Badges -->
  <rect x="20" y="60" width="120" height="30" fill="#111111" rx="4" stroke="#00ffff" stroke-width="1" filter="url(#neonGlowAbout)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="80" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ffff" filter="url(#neonGlowAbout)">
    SOFTWARE DEV STUDENT
  </text>
  
  <rect x="150" y="60" width="120" height="30" fill="#111111" rx="4" stroke="#ff00ff" stroke-width="1" filter="url(#neonGlowAbout)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <text x="210" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff00ff" filter="url(#neonGlowAbout)">
    MULTIPLATFORM DEV
  </text>
  
  <rect x="280" y="60" width="100" height="30" fill="#111111" rx="4" stroke="#00ff66" stroke-width="1" filter="url(#neonGlowAbout)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="330" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ff66" filter="url(#neonGlowAbout)">
    PROJECT-BASED
  </text>
  
  <!-- Second row badges -->
  <rect x="20" y="100" width="120" height="30" fill="#111111" rx="4" stroke="#00ffff" stroke-width="1" filter="url(#neonGlowAbout)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <text x="80" y="120" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ffff" filter="url(#neonGlowAbout)">
    TECHNICAL LEAD
  </text>
  
  <rect x="150" y="100" width="120" height="30" fill="#111111" rx="4" stroke="#ff00ff" stroke-width="1" filter="url(#neonGlowAbout)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.8s" repeatCount="indefinite"/>
  </rect>
  <text x="210" y="120" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff00ff" filter="url(#neonGlowAbout)">
    AI-ASSISTED DEV
  </text>
  
  <!-- Description -->
  <text x="20" y="155" font-family="Arial, sans-serif" font-size="11" fill="#a0a0a0">
    Building professional profile through practical projects
  </text>
  <text x="20" y="170" font-family="Arial, sans-serif" font-size="11" fill="#a0a0a0">
    and teamwork. Focused on Full Stack, Multiplatform,
  </text>
  <text x="20" y="185" font-family="Arial, sans-serif" font-size="11" fill="#a0a0a0">
    and AI-assisted development.
  </text>
  
  <!-- Animated border -->
  <rect x="5" y="5" width="390" height="190" fill="none" stroke="url(#neonCyanAbout)" stroke-width="1" rx="6" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
