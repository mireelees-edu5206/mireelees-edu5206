<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="statsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0d1117" rx="12" stroke="#30363d" stroke-width="1"/>
  
  <!-- Title -->
  <text x="200" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#statsGradient)">
    GITHUB STATS
  </text>
  
  <!-- Stats grid -->
  <rect x="30" y="60" width="150" height="80" fill="#161b22" rx="8" stroke="#30363d" stroke-width="1"/>
  <text x="105" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#c9d1d9">
    11
  </text>
  <text x="105" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">
    Repositories
  </text>
  
  <rect x="220" y="60" width="150" height="80" fill="#161b22" rx="8" stroke="#30363d" stroke-width="1"/>
  <text x="295" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#c9d1d9">
    0
  </text>
  <text x="295" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">
    Stars
  </text>
  
  <rect x="30" y="160" width="150" height="80" fill="#161b22" rx="8" stroke="#30363d" stroke-width="1"/>
  <text x="105" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#c9d1d9">
    0
  </text>
  <text x="105" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">
    Followers
  </text>
  
  <rect x="220" y="160" width="150" height="80" fill="#161b22" rx="8" stroke="#30363d" stroke-width="1"/>
  <text x="295" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#c9d1d9">
    2024
  </text>
  <text x="295" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">
    Joined
  </text>
  
  <!-- Languages preview -->
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">
    Top Languages: Python • JavaScript • TypeScript
  </text>
</svg>
