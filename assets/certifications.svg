<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150" viewBox="0 0 600 150">
  <defs>
    <linearGradient id="neonCyanCert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlowCert">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="150" fill="#000000" rx="8" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Title -->
  <text x="20" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#e0e0e0">
    CERTIFICATIONS
  </text>
  
  <!-- Divider -->
  <line x1="20" y1="45" x2="580" y2="45" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Placeholder cards -->
  <rect x="20" y="60" width="170" height="70" fill="#111111" rx="4" stroke="#1a1a1a" stroke-width="1"/>
  <text x="105" y="85" text-anchor="middle" font-family="monospace" font-size="10" fill="#808080">
    CERTIFICATION
  </text>
  <text x="105" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#606060">
    NAME
  </text>
  <text x="105" y="115" text-anchor="middle" font-family="monospace" font-size="9" fill="#606060">
    INSTITUTION
  </text>
  <text x="105" y="125" text-anchor="middle" font-family="monospace" font-size="8" fill="#404040">
    YEAR
  </text>
  
  <rect x="210" y="60" width="170" height="70" fill="#111111" rx="4" stroke="#1a1a1a" stroke-width="1"/>
  <text x="295" y="85" text-anchor="middle" font-family="monospace" font-size="10" fill="#808080">
    CERTIFICATION
  </text>
  <text x="295" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#606060">
    NAME
  </text>
  <text x="295" y="115" text-anchor="middle" font-family="monospace" font-size="9" fill="#606060">
    INSTITUTION
  </text>
  <text x="295" y="125" text-anchor="middle" font-family="monospace" font-size="8" fill="#404040">
    YEAR
  </text>
  
  <rect x="400" y="60" width="180" height="70" fill="#111111" rx="4" stroke="#1a1a1a" stroke-width="1"/>
  <text x="490" y="85" text-anchor="middle" font-family="monospace" font-size="10" fill="#808080">
    CERTIFICATION
  </text>
  <text x="490" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#606060">
    NAME
  </text>
  <text x="490" y="115" text-anchor="middle" font-family="monospace" font-size="9" fill="#606060">
    INSTITUTION
  </text>
  <text x="490" y="125" text-anchor="middle" font-family="monospace" font-size="8" fill="#404040">
    YEAR
  </text>
  
  <!-- Animated border -->
  <rect x="5" y="5" width="590" height="140" fill="none" stroke="url(#neonCyanCert)" stroke-width="1" rx="6" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
