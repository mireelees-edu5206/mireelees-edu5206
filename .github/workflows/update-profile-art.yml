name: Update Profile Art

on:
  schedule:
    # Ejecutar diariamente a las 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Permitir ejecución manual

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      
      - name: Fetch contributions
        run: |
          cd scripts
          python fetch_contributions.py
      
      - name: Render heatmap SVG
        run: |
          cd scripts
          python render_heatmap_svg.py
      
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update contribution heatmap'
          file_pattern: 'contrib-heatmap.svg data/contributions.json'
